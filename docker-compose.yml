services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-ielts-db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5433:5432"
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  apex_pgdata:
